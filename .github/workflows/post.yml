name: Post Daily Reflection
on:
  schedule:
    - cron: "50 21 * * *"   # 05:50 Singapore
    - cron: "20 0 * * *"    # 08:20 Singapore (retry; posting is idempotent)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to post (YYYY-MM-DD). Blank = today in Singapore."
        required: false
      dry_run:
        description: "Check only, post nothing"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: post-daily-reflection
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          MEDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }},https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}
        run: python3 scripts/post.py
      - name: Save posted marker
        if: always()
        run: |
          git config user.name "Daily Reflection bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted || true
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F)" && git push)
