name: Refresh Instagram token
on:
  schedule:
    - cron: "17 3 * * 1"    # Mondays 11:17 Singapore
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/refresh_token.py
