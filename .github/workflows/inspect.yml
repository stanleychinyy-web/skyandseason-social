name: Inspect Instagram media (read-only)
on:
  workflow_dispatch:
    inputs:
      media_ids:
        description: "Comma-separated Instagram media ids"
        required: true
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p diagnostics && python3 scripts/inspect_media.py > diagnostics/inspect.txt; cat diagnostics/inspect.txt
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_IDS: ${{ inputs.media_ids }}
      - run: |
          git config user.name "Daily Reflection bot"; git config user.email "actions@users.noreply.github.com"
          git add diagnostics; git commit -m "Inspect media" && (git push || (git pull --rebase -q origin main && git push))
