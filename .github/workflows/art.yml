name: Generate reel art
on:
  workflow_dispatch:
    inputs:
      prompts:
        description: "Path to a prompts JSON in the repo (default: tools/art/test-prompts.json)"
        required: false
      out:
        description: "Output folder (committed to main)"
        required: false
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Generate
        run: |
          python3 tools/art/gen.py "${{ inputs.out || 'media/art-test' }}" "${{ inputs.prompts || 'tools/art/test-prompts.json' }}"
      - name: Commit
        run: |
          git config user.name "Reel art bot"; git config user.email "actions@users.noreply.github.com"
          git add media && git diff --cached --quiet || (git commit -m "Reel art: ${{ inputs.out || 'media/art-test' }}" && (git push || (git pull --rebase -q origin main && git push)))
