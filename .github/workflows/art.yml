name: Generate reel art
on:
  workflow_dispatch:
    inputs:
      prompts:
        description: "Path to a prompts JSON in the repo (default: tools/art/test-prompts.json)"
        required: false
      out:
        description: "Output folder (committed to main)"
        required: false
      routes:
        description: "lcm (quality) and/or turbo (fast), comma-separated"
        required: false
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Install (open-source image models)
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q diffusers transformers accelerate peft safetensors pillow
      - name: Generate
        env:
          ART_ROUTES: ${{ inputs.routes || 'lcm,turbo' }}
        run: |
          python3 tools/art/gen.py "${{ inputs.out || 'media/art-test' }}" "${{ inputs.prompts || 'tools/art/test-prompts.json' }}"
      - uses: actions/upload-artifact@v4
        with: { name: "art-${{ github.run_id }}", path: "${{ inputs.out || 'media/art-test' }}", if-no-files-found: ignore }
      - name: Commit
        run: |
          git config user.name "Reel art bot"; git config user.email "actions@users.noreply.github.com"
          git add media && git diff --cached --quiet || (git commit -m "Reel art: ${{ inputs.out || 'media/art-test' }}" && (git push || (git pull --rebase -q origin main && git push) || (git pull --rebase -q -X theirs origin main && git push)))
